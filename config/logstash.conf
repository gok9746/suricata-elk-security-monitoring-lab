input {
  beats {
    port => 5000
  }
}

filter {
  # Parse top-level JSON message
  if [message] =~ /^{.*}$/ {
    json {
      source => "message"
    }
  }

  # Rename Docker fields for container logs
  mutate {
    rename => {
      "[log]" => "message"
      "[stream]" => "log_stream"
    }
  }

  # Add Docker container metadata
  if [docker][container][name] {
    mutate {
      add_field => { "container_name" => "%{[docker][container][name]}" }
    }
  }

  if [docker][container][id] {
    mutate {
      add_field => { "container_id" => "%{[docker][container][id]}" }
    }
  }

  # Juice Shop-specific processing
  if [docker][container][labels]["com.docker.compose.service"] == "juice-shop" {
    if [message] =~ /^{.*}$/ {
      json {
        source => "message"
        target => "juice_shop"
        remove_field => ["message"]
      }

      mutate {
        rename => {
          "[juice_shop][message]" => "message"
        }
      }

      mutate {
        gsub => ["[juice_shop][timestamp]", "[”“]", ""]
      }

      date {
        match => ["[juice_shop][timestamp]", "ISO8601"]
        target => "@timestamp"
      }

      mutate {
        add_field => {
          "service" => "juice-shop"
          "log_level" => "%{[juice_shop][level]}"
        }
      }
    }
  }

  # Suricata log processing
  if [log_type] == "suricata" {
    json {
      source => "message"
      remove_field => ["message"]
    }

    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }

  # 🐍 Cowrie log processing
  if [log_type] == "cowrie" {
    grok {
      match => {
        "message" => "%{TIMESTAMP_ISO8601:timestamp} \[%{DATA:component}\] %{GREEDYDATA:cowrie_message}"
      }
    }

    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }

    mutate {
      add_field => {
        "service" => "cowrie"
      }
    }
  }
}

output {
  if [log_type] == "suricata" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "suricata-logs-%{+YYYY.MM.dd}"
    }
  } else if [docker][container][labels]["com.docker.compose.service"] == "juice-shop" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "juice-shop-logs-%{+YYYY.MM.dd}"
    }
  } else if [log_type] == "cowrie" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "cowrie-logs-%{+YYYY.MM.dd}"
    }
  }

  stdout {
    codec => rubydebug
  }
}
